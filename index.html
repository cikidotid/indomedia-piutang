const SUPABASE_URL = "https://slmwnzvusdbbceocvedm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_FPqI1h-YLgLK1Sir6Y9ZPA_BeetRIQr";
const SUPABASE_ENABLED = SUPABASE_URL.startsWith("https://") && SUPABASE_ANON_KEY.length > 20;
const sb = SUPABASE_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let apiDashboard = null;
let apiLoading = false;

function mapClient(c){return {id:String(c.client_id||""),name:String(c.nama_client||""),pic:String(c.pic||""),phone:String(c.no_hp||""),address:String(c.alamat||""),active:String(c.status||"").toLowerCase()==="aktif",status:c.status||"",sheet:""};}
function mapTrx(t){return {id:String(t.trx_id||""),client:String(t.client_id||""),date:String(t.tanggal||"").slice(0,10),invoice:String(t.no_invoice||t.trx_id||""),note:String(t.keterangan||""),account:t.rekening_id||"",createdBy:String(t.created_by||""),items:Array.isArray(t.items)?t.items:[],totalApi:Number(t.total)||0,paidApi:Number(t.dibayar)||0,balanceApi:Number(t.sisa)||0,statusApi:String(t.status||"")};}
function mapDetail(d){return {name:String(d.barang_jasa||""),spec:String(d.spesifikasi||""),qty:Number(d.qty)||0,unit:String(d.satuan||""),price:Number(d.harga)||0,discount:Number(d.diskon)||0};}
function mapPayment(p){return {id:String(p.payment_id||""),trx:String(p.trx_id||""),date:String(p.tanggal||"").slice(0,10),amount:Number(p.nominal)||0,method:String(p.metode||""),account:String(p.rekening_id||""),proof:String(p.bukti||""),note:String(p.keterangan||""),type:String(p.jenis||"Pembayaran"),by:String(p.created_by||"")};}
function mapAccount(a){return {id:String(a.rekening_id||""),bank:String(a.bank||""),number:String(a.nomor_rekening||""),owner:String(a.nama_pemilik||""),status:String(a.status||"")};}
function mapProduct(p){return {id:String(p.product_id||""),name:String(p.nama||""),unit:String(p.satuan||""),cat:String(p.kategori||""),price:Number(p.harga_default)||0};}
function mapUser(u){return {id:String(u.user_id||""),username:String(u.username||""),email:String(u.email||""),name:String(u.nama||""),role:String(u.role||"user"),status:String(u.status||"Aktif")};}
function userDisplayName(id){const key=String(id||"");if(!key)return "-";const u=(data.users||[]).find(x=>x.id===key||x.username===key);if(u)return u.name||u.username||key;if(key==="TEST-ADMIN")return "Admin";return key;}
function makeId(){if(window.crypto&&typeof window.crypto.randomUUID==="function")return window.crypto.randomUUID();return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==="x"?r:(r&3)|8;return v.toString(16)});}

async function sbq(q,label){const {data,error}=await q;if(error)throw new Error((label?label+": ":"")+error.message);return data||[];}
async function loadFromApi(){
  if(!SUPABASE_ENABLED){toast("Isi SUPABASE_URL dan ANON KEY dulu");return;}
  apiLoading=true;
  try{
    const [clients,txv,details,pays,accounts,products,users]=await Promise.all([
      sbq(sb.from("clients").select("*").order("nama_client"),"Client"),
      sbq(sb.from("v_transactions").select("*").order("tanggal",{ascending:false}),"Transaksi"),
      sbq(sb.from("transaction_details").select("*"),"Detail"),
      sbq(sb.from("payments").select("*").order("tanggal",{ascending:false}),"Pembayaran"),
      sbq(sb.from("accounts").select("*").order("bank"),"Rekening"),
      sbq(sb.from("products").select("*").order("nama"),"Produk"),
      sbq(sb.from("users").select("*").order("nama"),"User")
    ]);
    data.clients=clients.map(mapClient); data.accounts=accounts.map(mapAccount); data.products=products.map(mapProduct); data.users=users.map(mapUser); data.payments=pays.map(mapPayment);
    const grouped=new Map();
    details.forEach(d=>{const k=d.trx_id;(grouped.get(k)||grouped.set(k,[]).get(k)).push(mapDetail(d));});
    data.tx=txv.map(t=>mapTrx({...t,items:grouped.get(t.trx_id)||[]}));
    const total=data.tx.reduce((a,t)=>a+t.totalApi,0), paid=data.tx.reduce((a,t)=>a+t.paidApi,0);
    apiDashboard={summary:{total_piutang:total,total_pembayaran:paid,sisa_piutang:Math.max(total-paid,0),total_client:data.clients.filter(c=>c.active).length},recent_transactions:data.tx.slice(0,5),largest_receivables:data.clients.map(c=>({client_id:c.id,nama_client:c.name,pic:c.pic,sisa_piutang:data.tx.filter(t=>t.client===c.id).reduce((a,t)=>a+t.balanceApi,0)})).filter(x=>x.sisa_piutang>0).sort((a,b)=>b.sisa_piutang-a.sisa_piutang).slice(0,5)};
    render(); toast("✓ Supabase tersambung");
  }catch(e){console.error(e);toast("Supabase: "+e.message)}finally{apiLoading=false}
}

async function saveToSupabaseTransaction(obj){
  const trxId=obj.id||makeId();
  const invoice=obj.invoice||nextInvoice();
  const total=obj.items.reduce((a,i)=>a+i.qty*i.price*(1-(i.discount||0)/100),0);
  if(obj.id){
    const {data:cur,error:ce}=await sb.from("transactions").select("trx_id,client_id,tanggal,no_invoice,keterangan,rekening_id,created_by").eq("trx_id",trxId).single();
    if(ce)throw ce;
    const {data:pay,error:pe}=await sb.from("v_transactions").select("dibayar").eq("trx_id",trxId).single();
    if(pe)throw pe;
    const paid=Number(pay?.dibayar||0);
    if(total<paid)throw new Error(`Total baru ${money(total)} lebih kecil dari pembayaran yang sudah masuk ${money(paid)}.`);
    const {error:ue}=await sb.from("transactions").update({client_id:obj.client,tanggal:obj.date,keterangan:obj.note,rekening_id:obj.account}).eq("trx_id",trxId);
    if(ue)throw ue;
    const {data:oldDetails,error:de}=await sb.from("transaction_details").select("detail_id,trx_id,barang_jasa,spesifikasi,qty,satuan,harga,diskon").eq("trx_id",trxId);
    if(de)throw de;
    const {error:delErr}=await sb.from("transaction_details").delete().eq("trx_id",trxId);
    if(delErr){await sb.from("transactions").update({client_id:cur.client_id,tanggal:cur.tanggal,keterangan:cur.keterangan,rekening_id:cur.rekening_id}).eq("trx_id",trxId);throw delErr;}
    const rows=obj.items.map(i=>({detail_id:makeId(),trx_id:trxId,barang_jasa:i.name,spesifikasi:i.spec,qty:i.qty,satuan:i.unit,harga:i.price,diskon:i.discount||0}));
    const {error:ie}=await sb.from("transaction_details").insert(rows);
    if(ie){
      await sb.from("transaction_details").delete().eq("trx_id",trxId);
      if(oldDetails?.length)await sb.from("transaction_details").insert(oldDetails);
      await sb.from("transactions").update({client_id:cur.client_id,tanggal:cur.tanggal,keterangan:cur.keterangan,rekening_id:cur.rekening_id}).eq("trx_id",trxId);
      throw ie;
    }
    return {trxId,invoice,total,edited:true};
  }
  const {error:e1}=await sb.from("transactions").insert({trx_id:trxId,client_id:obj.client,tanggal:obj.date,no_invoice:invoice,keterangan:obj.note,rekening_id:obj.account,created_by:session.id});

  const {error:e2}=await sb.from("transaction_details").insert(rows);
  if(e2){await sb.from("transactions").delete().eq("trx_id",trxId);throw e2;}
  return {trxId,invoice,total,edited:false};
}

async function savePaymentToSupabase(t,amt,method,type,note){
  const {data:rows,error}=await sb.from("v_transactions").select("sisa").eq("trx_id",t.id).single(); if(error)throw error;
  const sisa=Number(rows.sisa||0);
  if(type!=="DP / Uang Muka" && amt>sisa)throw new Error("Nominal melebihi sisa piutang.");
  if(type==="Pelunasan" && amt!==sisa)throw new Error("Pelunasan harus sama dengan sisa piutang: "+money(sisa));
  const paymentId=makeId();
  let proofPath="";
  const file=document.getElementById("pproof")?.files?.[0];
  if(method==="Transfer" && file){
    if(file.size>3*1024*1024)throw new Error("Bukti maksimal 3 MB.");
    const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    proofPath=`${t.id}/${paymentId}-${safeName}`;
    const {error:upErr}=await sb.storage.from("bukti-pembayaran").upload(proofPath,file,{upsert:false,contentType:file.type||undefined});
    if(upErr)throw new Error("Upload bukti gagal: "+upErr.message);
  }
  const rekeningId=method==="Transfer" ? (document.getElementById("prekening")?.value||"") : "";
  if(method==="Transfer" && !rekeningId)throw new Error("Rekening tujuan wajib dipilih untuk pembayaran Transfer.");
  let oldAccount=t.account||"";
  if(method==="Transfer" && rekeningId){
    const {error:te}=await sb.from("transactions").update({rekening_id:rekeningId}).eq("trx_id",t.id);
    if(te){if(proofPath)await sb.storage.from("bukti-pembayaran").remove([proofPath]);throw te;}
  }
  const {error:e}=await sb.from("payments").insert({payment_id:paymentId,trx_id:t.id,tanggal:document.getElementById("pdate").value,nominal:amt,metode:method,jenis:type,rekening_id:rekeningId||null,bukti:proofPath,keterangan:note,created_by:session.id});
  if(e){
    if(method==="Transfer" && rekeningId)await sb.from("transactions").update({rekening_id:oldAccount||null}).eq("trx_id",t.id);
    if(proofPath)await sb.storage.from("bukti-pembayaran").remove([proofPath]);
    throw e;
  }
}

async function uploadProof(paymentId,trxId){
  const input=document.createElement("input"); input.type="file"; input.accept=".jpg,.jpeg,.png,.pdf";
  input.onchange=async()=>{
    const file=input.files?.[0]; if(!file)return;
    if(file.size>3*1024*1024)return toast("Bukti maksimal 3 MB.");
    try{
      const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      const path=`${trxId}/${paymentId}-${safeName}`;
      const {error:upErr}=await sb.storage.from("bukti-pembayaran").upload(path,file,{upsert:false,contentType:file.type||undefined});
      if(upErr)throw upErr;
      const {error:e}=await sb.from("payments").update({bukti:path}).eq("payment_id",paymentId);
      if(e){await sb.storage.from("bukti-pembayaran").remove([path]);throw e;}
      await loadFromApi(); state.detailTab="pay"; state.modal="trx"; state.trxId=trxId; render(); toast("✓ Bukti transfer tersimpan");
    }catch(e){toast("Gagal upload bukti: "+e.message)}
  }; input.click();
}

async function viewProof(path){
  if(!path)return toast("Bukti transfer belum diunggah.");
  if(/^https?:\/\//i.test(path)){window.open(path,"_blank","noopener,noreferrer");return;}
  const popup=window.open("about:blank","_blank");
  try{
    const {data,error}=await sb.storage.from("bukti-pembayaran").createSignedUrl(path,300);
    if(error)throw error;
    if(!data?.signedUrl)throw new Error("Signed URL tidak tersedia.");
    if(popup)popup.location.href=data.signedUrl; else window.location.href=data.signedUrl;
  }catch(e){if(popup)popup.close();toast("Gagal membuka bukti: "+e.message)}
}

function itemEditor(i,n){const sub=(Number(i.qty)||0)*(Number(i.price)||0)*(1-(Number(i.discount)||0)/100);return `<div class="itemrow" data-i="${n}"><div><label style="font-size:10px;color:#667085">Barang/Jasa</label><input class="iname" value="${esc(i.name)}" placeholder="Banner"></div><div><label style="font-size:10px;color:#667085">Spesifikasi</label><input class="ispec" value="${esc(i.spec)}" placeholder="3 × 1 m"></div><div><label style="font-size:10px;color:#667085">Qty</label><input class="iqty" type="number" min="0" value="${i.qty}"></div><div><label style="font-size:10px;color:#667085">Satuan</label><input class="iunit" value="${esc(i.unit)}"></div><div><label style="font-size:10px;color:#667085">Harga</label><input class="iprice" type="number" min="0" value="${i.price}"></div><div><label style="font-size:10px;color:#667085">Diskon %</label><input class="idiscount" type="number" min="0" max="100" value="${i.discount||0}"></div><div class="isubtotal"><label style="font-size:10px;color:#667085">Subtotal</label><div class="item-subtotal" style="height:36px;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#f8f9fc;font-weight:800;box-sizing:border-box">${money(sub)}</div></div><button class="remove" onclick="this.parentElement.remove();calcForm()">×</button></div>`}

function calcForm(){let sum=0;document.querySelectorAll(".itemrow").forEach(r=>{const q=+r.querySelector(".iqty").value||0,p=+r.querySelector(".iprice").value||0,d=+r.querySelector(".idiscount").value||0;const sub=q*p*(1-d/100);sum+=sub;const se=r.querySelector(".item-subtotal");if(se)se.textContent=money(sub)});const e=document.getElementById("formTotal");if(e)e.textContent=money(sum)}
function collectItems(){return [...document.querySelectorAll(".itemrow")].map(r=>({name:r.querySelector(".iname").value.trim(),spec:r.querySelector(".ispec").value.trim(),qty:+r.querySelector(".iqty").value||0,unit:r.querySelector(".iunit").value.trim()||"Pcs",price:+r.querySelector(".iprice").value||0,discount:+r.querySelector(".idiscount").value||0})).filter(i=>i.name&&i.qty>0)}
async function getNextInvoice(date){const d=String(date||new Date().toISOString().slice(0,10)).slice(0,10),ds=d.replaceAll("-",""),prefix=`INV-${ds}-`;const rows=await sbq(sb.from("transactions").select("no_invoice").eq("tanggal",d),"Nomor transaksi");const valid=rows.map(r=>String(r.no_invoice||"")).filter(v=>v.startsWith(prefix)).map(v=>parseInt(v.slice(prefix.length),10)).filter(Number.isFinite);const next=valid.length?Math.max(...valid)+1:1;return `${prefix}${String(next).padStart(3,"0")}`}

async function saveTrx(){
  if(!SUPABASE_ENABLED)return toast("Isi Supabase config dulu.");
  const items=collectItems();if(!items.length)return toast("Minimal 1 item harus diisi.");
  const date=document.getElementById("fdate").value;
  let invoice=state.editId?document.getElementById("finvoice").value:await getNextInvoice(date);
  const obj={id:state.editId,client:document.getElementById("fclient").value,date,invoice,note:document.getElementById("fnote").value.trim(),account:document.getElementById("faccount").value,items};
  const invEl=document.getElementById("finvoice");if(invEl)invEl.value=invoice;
  try{
    const result=await saveToSupabaseTransaction(obj);
    state.modal=null;state.editId=null;state.newInvoice="";await loadFromApi();
    toast(result.edited?"✓ Transaksi diperbarui di Supabase":"✓ Piutang masuk Supabase");
  }catch(e){
    if(!state.editId&&String(e.message||"").includes("no_invoice_key")){
      try{obj.invoice=await getNextInvoice(date);if(invEl)invEl.value=obj.invoice;const result=await saveToSupabaseTransaction(obj);state.modal=null;state.editId=null;state.newInvoice="";await loadFromApi();toast("✓ Piutang masuk Supabase");return}catch(e2){e=e2}}
    console.error(e);toast("Gagal simpan piutang: "+e.message)
  }
}

 <div class="field"><label>Jenis Pembayaran</label><select id="ptype" onchange="togglePaymentType()"><option>DP / Uang Muka</option><option selected>Pembayaran</option><option>Pelunasan</option></select><div id="paytypehint" class="muted" style="margin-top:5px">Pembayaran biasa tidak boleh melebihi sisa piutang.</div></div>
 <div class="field"><label>Metode Pembayaran</label><select id="pmethod" onchange="toggleProof()"><option>Transfer</option>${session.role==="admin"?`<option>Cash</option>`:""}</select></div>
 <div class="field"><label>Rekening Tujuan <span style="font-weight:400;color:#9aa4b6">(tampil di invoice)</span></label><select id="prekening">${data.accounts.filter(a=>a.status.toLowerCase()==="aktif").map(a=>`<option value="${esc(a.id)}" ${a.id===t.account?"selected":""}>${esc(a.bank)} - ${esc(a.number)} · a.n. ${esc(a.owner)}</option>`).join("")}</select></div>
 <div class="field"><label>Bukti Transfer <span style="font-weight:400;color:#9aa4b6">(maks. 3 MB)</span></label><input id="pproof" type="file" accept=".jpg,.jpeg,.png,.pdf" onchange="previewProof(event)"><div id="proofname" class="muted" style="margin-top:5px"></div></div>
 <div class="field full"><label>Catatan</label><input id="pnote" placeholder="DP / Pelunasan / keterangan"></div>
 </div><div class="hint">Bukti transfer disimpan di Supabase Storage secara private. Database hanya menyimpan path file.</div>
 <div class="actions" style="justify-content:flex-end"><button class="btn ghost" onclick="state.modal='trx';render()">Batal</button><button class="btn primary" onclick="savePayment()">Simpan Pembayaran</button></div></div></div></div>`}
function togglePaymentType(){const type=document.getElementById("ptype")?.value,amt=document.getElementById("pamount"),t=txById(state.trxId),hint=document.getElementById("paytypehint");if(!amt)return;if(type==="DP / Uang Muka"){amt.removeAttribute("max");if(hint)hint.textContent="DP boleh lebih dari total nota. Kelebihan dicatat sebagai saldo lebih client.";}else{amt.max=balanceTx(t);if(hint)hint.textContent=type==="Pelunasan"?"Pelunasan harus sama dengan sisa piutang.":"Pembayaran biasa tidak boleh melebihi sisa piutang.";}}
function toggleProof(){const method=document.getElementById("pmethod").value;document.getElementById("pproof").disabled=method==="Cash";const r=document.getElementById("prekening");if(r)r.disabled=method==="Cash";if(method==="Cash"){document.getElementById("pproof").value="";if(r)r.value="";}else if(r && !r.value){const a=data.accounts.find(a=>a.status.toLowerCase()==="aktif");if(a)r.value=a.id;}}
function previewProof(e){const f=e.target.files[0];if(!f)return;if(f.size>3*1024*1024){e.target.value="";return toast("Bukti maksimal 3 MB.")}document.getElementById("proofname").textContent=f.name}
let proofData="";
async function savePayment(){
  const t=txById(state.trxId),amt=+document.getElementById("pamount").value;if(!amt)return toast("Nominal pembayaran wajib diisi.");
  const method=document.getElementById("pmethod").value,type=document.getElementById("ptype").value;if(method==="Cash"&&session.role!=="admin")return toast("Cash hanya dapat diinput Admin.");
  if(type==="Pelunasan" && amt!==balanceTx(t))return toast("Pelunasan harus sama dengan sisa piutang: "+money(balanceTx(t)));
  if(type!=="DP / Uang Muka" && amt>balanceTx(t))return toast("Nominal melebihi sisa piutang.");
  try{await savePaymentToSupabase(t,amt,method,type,document.getElementById("pnote").value.trim());const over=type==="DP / Uang Muka" && amt>balanceTx(t);state.modal=null;await loadFromApi();toast(over?"✓ DP tersimpan · Kelebihan jadi saldo client":"✓ Pembayaran masuk Supabase");}catch(e){toast("Gagal simpan pembayaran: "+e.message)}
}
function openClientPaymentPicker(clientId){state.clientPaymentClientId=clientId;state.modal="client-payment-picker";render()}
function clientPaymentPicker(){const id=state.clientPaymentClientId, c=clientById(id), tx=data.tx.filter(t=>t.client===id&&balanceTx(t)>0).sort((a,b)=>b.date.localeCompare(a.date));return `<div class="modal open"><div class="modalbox"><div class="modalhead"><div><b>Pilih Nota Pembayaran</b><div class="muted">${esc(c?.name||"")}</div></div><button class="close" onclick="state.modal=null;render()">×</button></div><div class="modalbody">${tx.length?tx.map(t=>`<button class="btn ghost" style="width:100%;text-align:left;margin-bottom:8px;padding:12px" onclick="state.trxId='${t.id}';state.modal='payment';render()"><b>${esc(t.invoice)}</b><span style="float:right">Sisa ${money(balanceTx(t))}</span><div class="muted" style="margin-top:3px">${fmtDate(t.date)} · ${esc(t.note||"")}</div></button>`).join(""):`<div class="empty">Tidak ada nota yang masih memiliki sisa piutang.</div>`}</div></div></div>`}
function openClientModal(id=""){if(id&&session.role!=="admin")return toast("Edit client hanya untuk Admin.");state.clientEditId=id||null;state.modal="client";render()}
function clientModal(){const c=state.clientEditId?clientById(state.clientEditId):null,editing=!!c;return `<div class="modal open"><div class="modalbox"><div class="modalhead"><b>${editing?"Edit Client":"Tambah Client"}</b><button class="close" onclick="state.modal=null;state.clientEditId=null;render()">×</button></div><div class="modalbody"><div class="formgrid"><div class="field full"><label>Nama Client</label><input id="cn" placeholder="Nama perusahaan / pelanggan" value="${esc(c?.name||"")}"></div><div class="field"><label>PIC / Kontak</label><input id="cp" value="${esc(c?.pic||"")}"></div><div class="field"><label>No. HP</label><input id="ct" value="${esc(c?.phone||"")}"></div><div class="field full"><label>Alamat</label><input id="ca" value="${esc(c?.address||"")}"></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" onclick="state.modal=null;state.clientEditId=null;render()">Batal</button><button class="btn primary" onclick="saveClient()">${editing?"Simpan Perubahan":"Simpan"}</button></div></div></div></div>`}
async function saveClient(){if(!SUPABASE_ENABLED)return toast("Isi Supabase config dulu.");const editing=!!state.clientEditId;if(editing&&session.role!=="admin")return toast("Edit client hanya untuk Admin.");try{const mode=await saveClientToSupabase();state.modal=null;state.clientEditId=null;await loadFromApi();toast(mode==="edit"?"✓ Client diperbarui":"✓ Client masuk Supabase");}catch(e){toast("Gagal "+(editing?"mengubah":"menambah")+" client: "+e.message)}}
async function deleteClient(id){if(session.role!=="admin")return toast("Hapus client hanya untuk Admin.");const c=clientById(id);if(!c)return;const txCount=data.tx.filter(t=>t.client===id).length;if(txCount>0)return toast("Client tidak bisa dihapus karena sudah memiliki "+txCount+" transaksi. Riwayat piutang harus tetap aman.");if(!confirm(`Hapus client "${c.name}"?\nTindakan ini tidak bisa dibatalkan.`))return;try{const {error}=await sb.from("clients").delete().eq("client_id",id);if(error)throw error;await loadFromApi();toast("✓ Client dihapus");}catch(e){toast("Gagal hapus client: "+e.message)}}
function openAccountModal(){state.modal="account";render()}
function accountModal(){return `<div class="modal open"><div class="modalbox"><div class="modalhead"><b>Tambah Rekening</b><button class="close" onclick="state.modal=null;render()">×</button></div><div class="modalbody"><div class="formgrid"><div class="field"><label>Bank</label><input id="ab"></div><div class="field"><label>Nomor Rekening</label><input id="an"></div><div class="field full"><label>Nama Pemilik</label><input id="ao" value="INDOMEDIA"></div></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn primary" onclick="saveAccount()">Simpan</button></div></div></div></div>`}
async function saveAccount(){if(!SUPABASE_ENABLED)return toast("Isi Supabase config dulu.");const {error}=await sb.from("accounts").insert({rekening_id:"R"+Date.now().toString().slice(-8),bank:document.getElementById("ab").value.trim(),nomor_rekening:document.getElementById("an").value.trim(),nama_pemilik:document.getElementById("ao").value.trim(),status:"Aktif"});if(error)return toast("Gagal: "+error.message);state.modal=null;await loadFromApi();toast("✓ Rekening masuk Supabase")}
function openProductModal(){if(session.role!=="admin")return toast("Hanya Admin yang dapat mengelola Produk / Jasa.");state.modal="product";state.productEditId=null;render()}
function openProductEditModal(id){if(session.role!=="admin")return toast("Hanya Admin yang dapat mengubah harga.");const p=(data.products||[]).find(x=>String(x.id)===String(id));if(!p)return toast("Produk tidak ditemukan.");state.modal="product-edit";state.productEditId=p.id;render()}
function productModal(){const edit=state.modal==="product-edit",p=edit?(data.products||[]).find(x=>String(x.id)===String(state.productEditId)):null;return `<div class="modal open"><div class="modalbox"><div class="modalhead"><b>${edit?"Update Harga Produk / Jasa":"Tambah Produk / Jasa"}</b><button class="close" onclick="state.modal=null;render()">×</button></div><div class="modalbody">${edit?`<div class="field"><label>Nama</label><input value="${esc(p?.name||"")}" disabled></div><div class="field" style="margin-top:12px"><label>Harga Default</label><input id="pp" type="number" value="${Number(p?.price)||0}" min="0"></div>`:`<div class="formgrid"><div class="field"><label>Nama</label><input id="pn"></div><div class="field"><label>Satuan</label><input id="pu" value="Pcs"></div><div class="field"><label>Kategori</label><input id="pc"></div><div class="field"><label>Harga Default</label><input id="pp" type="number" min="0"></div></div>`}<div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" onclick="state.modal=null;render()">Batal</button><button class="btn primary" onclick="${edit?"updateProductPrice()":"saveProduct()"}">${edit?"Update Harga":"Simpan"}</button></div></div></div></div>`}
async function saveProduct(){if(!SUPABASE_ENABLED)return toast("Isi Supabase config dulu.");if(session.role!=="admin")return toast("Hanya Admin yang dapat menambah Produk / Jasa.");const {error}=await sb.from("products").insert({product_id:"P"+Date.now().toString().slice(-8),nama:document.getElementById("pn").value.trim(),satuan:document.getElementById("pu").value.trim(),kategori:document.getElementById("pc").value.trim(),harga_default:+document.getElementById("pp").value||0});if(error)return toast("Gagal: "+error.message);state.modal=null;await loadFromApi();toast("✓ Produk masuk Supabase")}
async function updateProductPrice(){if(!SUPABASE_ENABLED)return toast("Isi Supabase config dulu.");if(session.role!=="admin")return toast("Hanya Admin yang dapat mengubah harga.");const id=state.productEditId,price=+document.getElementById("pp").value||0;if(price<0)return toast("Harga tidak boleh negatif.");const {error}=await sb.from("products").update({harga_default:price}).eq("product_id",id);if(error)return toast("Gagal update: "+error.message);state.modal=null;state.productEditId=null;await loadFromApi();toast("✓ Harga produk diperbarui")}

function openUserModal(){state.modal="user";render()}
function userModal(){return `<div class="modal open"><div class="modalbox"><div class="modalhead"><div><b>Tambah User</b><div class="muted" style="margin-top:3px">Sekali simpan langsung membuat akun login.</div></div><button class="close" onclick="state.modal=null;render()">×</button></div><div class="modalbody"><div class="formgrid"><div class="field"><label>Nama</label><input id="un" placeholder="Nama lengkap"></div><div class="field"><label>Username</label><input id="uu" placeholder="username" autocomplete="off"></div><div class="field"><label>Email Login</label><input id="ue" type="email" placeholder="nama@indomedia.id" autocomplete="off"></div><div class="field"><label>Password</label><input id="up" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password"></div><div class="field"><label>Role</label><select id="ur"><option value="user">User</option><option value="admin">Admin</option></select></div><div class="field"><label>Status</label><select id="us"><option value="Aktif">Aktif</option><option value="Nonaktif">Nonaktif</option></select></div></div><div class="hint" style="margin-top:14px">Akun dibuat di Supabase Auth dan otomatis dihubungkan ke data User. Password tidak disimpan di tabel aplikasi.</div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn ghost" onclick="state.modal=null;render()">Batal</button><button class="btn primary" id="saveUserBtn" onclick="saveUser()">Buat User</button></div></div></div></div>`}
async function saveUser(){if(!SUPABASE_ENABLED)return toast("Isi Supabase config dulu.");if(session.role!=="admin")return toast("Hanya Admin yang dapat membuat User.");const u=document.getElementById("uu").value.trim(),name=document.getElementById("un").value.trim(),email=document.getElementById("ue").value.trim(),password=document.getElementById("up").value,role=document.getElementById("ur").value,status=document.getElementById("us").value;if(!name||!u||!email||!password)return toast("Nama, username, email, dan password wajib diisi.");if(password.length<8)return toast("Password minimal 8 karakter.");const btn=document.getElementById("saveUserBtn");if(btn){btn.disabled=true;btn.textContent="Membuat..."}try{const {data:{session:authSession},error:sessionError}=await sb.auth.getSession();if(sessionError||!authSession?.access_token){throw new Error("Sesi Admin tidak ditemukan. Silakan login ulang.")}const {data,error}=await sb.functions.invoke("create-user",{body:{name,username:u,email,password,role,status},headers:{Authorization:`Bearer ${authSession.access_token}`}});if(error){let msg=error.message||"Gagal membuat User.";try{const body=await error.context?.json();if(body?.error)msg=body.error}catch(_){}throw new Error(msg)}if(!data?.ok)throw new Error(data?.error||"Gagal membuat User.");state.modal=null;await loadFromApi();toast("✓ User + akun login berhasil dibuat")}catch(e){console.error(e);toast("Gagal: "+(e.message||"Tidak dapat membuat User."))}finally{if(btn){btn.disabled=false;btn.textContent="Buat User"}}}
function printInvoice(id){
 const t=txById(id),c=clientById(t.client),acc=data.accounts.find(a=>a.id===t.account),paid=paidTx(id);
 const w=window.open("","_blank");if(!w)return;
 const items=t.items.map((i,n)=>`<tr><td>${n+1}</td><td><b>${esc(i.name)}</b></td><td>${esc(i.spec||"-")}</td><td class="r">${i.qty} ${esc(i.unit)}</td><td class="r">${money(i.price)}</td><td class="r">${i.discount||0}%</td><td class="r"><b>${money(i.qty*i.price*(1-(i.discount||0)/100))}</b></td></tr>`).join("");
 w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(t.invoice)}</title><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;font-family:Arial,Helvetica,sans-serif;color:#111}.page{width:210mm;min-height:297mm;margin:0 auto;background:#fff;position:relative;overflow:hidden;padding:0}.invoice{position:relative;isolation:isolate;background:#fff;background-image:none!important;padding:34px 38px;min-height:297mm;overflow:hidden}.invoicehead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #182033;padding-bottom:17px}.invoice-logo{width:76px;height:76px;object-fit:contain;margin-right:13px}.invoice-brand{display:flex;align-items:center}.invoice h2{margin:0 0 3px;font-size:25px;letter-spacing:.2px}.muted{color:#687286;font-size:10px}.brand-sub{font-size:10px;color:#687286;letter-spacing:1.6px;text-transform:uppercase}.invoice-meta{text-align:right}.invoice-meta .label{font-size:10px;color:#7a8498;letter-spacing:1.3px}.invoice-meta .no{font-size:15px;font-weight:800;margin-top:3px}.invoice-meta .date{font-size:11px;color:#657084;margin-top:2px}.invoice-info{display:flex;justify-content:space-between;gap:24px;margin-top:20px}.invoice-info .to{font-size:12px;line-height:1.45}.invoice-info .to-label{font-size:10px;font-weight:800;color:#7a8498;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}.invoice table{width:100%;border-collapse:collapse;margin-top:22px;font-size:11px}.invoice thead th{padding:9px 8px;background:#f7f8fb;border-top:1px solid #e2e6ee;border-bottom:1px solid #dfe4ed;color:#5e687c;font-size:10px;text-transform:uppercase;letter-spacing:.5px}.invoice th,.invoice td{padding:10px 8px;border-bottom:1px solid #e8ebf1;text-align:left}.invoice tbody tr:last-child td{border-bottom:1px solid #d8dde7}.r{text-align:right!important}.invoice .totals{margin-left:auto;width:285px;margin-top:18px}.line{display:flex;justify-content:space-between;padding:5px 0;font-size:11px;color:#555f72}.line b{color:#111}.line.total{margin-top:4px;padding:10px 0;border-top:2px solid #182033;font-size:14px;font-weight:800;color:#111}.line.total b{font-size:15px}.bank{margin-top:30px;padding:14px 16px;border:1px solid #e0e4eb;border-left:4px solid #ed0b68;border-radius:9px;background:#fbfcfe;font-size:11px;line-height:1.5}.bank-title{font-weight:800;color:#182033;margin-bottom:3px}.footer-note{margin-top:22px;padding-top:12px;border-top:1px solid #e8ebf1;font-size:9px;color:#8a93a5;display:flex;justify-content:space-between}@page{size:A4;margin:0}@media print{body{background:#fff;background-image:none!important}.page,.invoice,.invoice::before,.invoice::after{background-image:none!important;content:none!important}.page{margin:0;width:210mm;min-height:297mm}.invoice{min-height:297mm}}
</style></head><body><div class="page"><div class="invoice"><div class="invoicehead"><div class="invoice-brand"><img class="invoice-logo" src="${location.origin}/assets/logo.png"><div><h2>INDOMEDIA</h2><div class="brand-sub">PERCETAKAN</div></div></div><div class="invoice-meta"><div class="label">INVOICE</div><div class="no">${esc(t.invoice)}</div><div class="date">${fmtDate(t.date)}</div></div></div><div class="invoice-info"><div class="to"><div class="to-label">Kepada</div><b>${esc(c.name)}</b><br><span class="muted">${esc(c.address||"")}</span></div><div class="to" style="text-align:right"><div class="to-label">Status</div><b>${esc(statusTx(t))}</b></div></div><table><thead><tr><th style="width:34px">No</th><th>Barang/Jasa</th><th>Spesifikasi</th><th class="r">Qty</th><th class="r">Harga</th><th class="r">Diskon</th><th class="r">Subtotal</th></tr></thead><tbody>${items}</tbody></table><div class="totals"><div class="line"><span>Total</span><b>${money(totalTx(t))}</b></div><div class="line"><span>Dibayar</span><b>${money(paid)}</b></div><div class="line total"><span>Sisa</span><b>${money(balanceTx(t))}</b></div><div class="line"><span>Dicetak oleh</span><span>${esc(session?.name||"-")}</span></div></div>${acc?`<div class="bank"><div class="bank-title">Pembayaran Transfer</div>${esc(acc.bank)} - ${esc(acc.number)}<br>a.n. ${esc(acc.owner)}</div>`:""}<div class="footer-note"><span>Terima kasih atas kepercayaan Anda.</span><span>INDOMEDIA PIUTANG</span></div></div></div><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()
}
restoreAuth();
</script>
